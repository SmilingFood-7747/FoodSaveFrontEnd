<section class="page narrow-page">
  <p class="eyebrow">FOODSAVE · SMILING FOOD</p>
  <h1>{{ 'legal.' + kind | translate }}</h1>
  <p class="muted">{{ 'legal.academic' | translate }}</p>
  <article class="panel legal-content">
    @for (n of [1, 2, 3, 4, 5]; track n) {
      <h2>{{ 'legal.' + kind + n + 'Title' | translate }}</h2>
      <p>{{ 'legal.' + kind + n + 'Body' | translate }}</p>
    }
    <button mat-stroked-button type="button" disabled>{{ 'nav.support' | translate }}</button>
  </article>
</section>
